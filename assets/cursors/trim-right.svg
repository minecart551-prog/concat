<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- A clip's leading edge: the triangle points into the clip, which lies
       to the right, and the bracket stands at the pointer - the edge itself -
       pushed right up against it, so the glyph reads as sitting on the
       boundary rather than floating off it. Hotspot (0, 12), the canvas's
       left end, which is where the pointer is. The mirror of trim-left, and
       flat in the same way: the triangle the accent, the bracket - twice
       the triangle's height yet finer than it, 22 tall against 10 with
       2-wide arms - white, with no outline on either, the dropped copy
       beneath being the only edge there is so the white still reads over a
       bright filmstrip or a light theme. -->
  <g transform="translate(0, 1)" opacity="0.42" fill="#05070a">
    <path d="M18 12 L9 7 L9 17 Z"/>
    <path d="M6 1 H0.5 V23 H6 V21 H2.5 V3 H6 Z"/>
  </g>
  <path d="M18 12 L9 7 L9 17 Z" fill="#cbf53f"/>
  <path d="M6 1 H0.5 V23 H6 V21 H2.5 V3 H6 Z" fill="#ffffff"/>
</svg>
