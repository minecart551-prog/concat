<svg xmlns="http://www.w3.org/2000/svg" width="36" height="24" viewBox="0 0 36 24">
  <!-- Both ways: on a seam the drag moves the cut and the two clips resize
       with it, and on an edge nothing abuts either end of, the drag may
       reach into the gap as readily as pull back from it - so neither side
       owns the motion and the glyph carries a triangle pointing each way,
       with the disc between them saying they belong together. The disc is
       the pointer, at the canvas's centre like all three trim cursors'
       hotspots, and the triangles are the one-sided cursors' own, in their
       own slots - sweeping a seam runs left triangle (trim-left) to this,
       to the right triangle (trim-right), and no shape ever translates or
       resizes with the swap. The triangles are the accent (Lime by default
       - Theme.accent; a cursor is a file and cannot follow a custom
       accent), the disc white; nothing is outlined, the dropped copy
       beneath being the only edge there is, so the white still reads over a
       bright filmstrip or a light theme. -->
  <g transform="translate(0, 1)" opacity="0.42" fill="#05070a">
    <path d="M0.5 12 L9.5 7 L9.5 17 Z"/>
    <path d="M35.5 12 L26.5 7 L26.5 17 Z"/>
    <circle cx="18" cy="12" r="3.5"/>
  </g>
  <path d="M0.5 12 L9.5 7 L9.5 17 Z" fill="#cbf53f"/>
  <path d="M35.5 12 L26.5 7 L26.5 17 Z" fill="#cbf53f"/>
  <circle cx="18" cy="12" r="3.5" fill="#ffffff"/>
</svg>
