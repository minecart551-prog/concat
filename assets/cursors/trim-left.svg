<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- A clip's trailing edge: the triangle points into the clip, which lies
       to the left, and the bracket stands at the pointer - the edge itself -
       pushed right up against it, so the glyph reads as sitting on the
       boundary rather than floating off it. Hotspot (24, 12), the canvas's
       right end, which is where the pointer is. Flat and unoutlined by
       design: the triangle is the accent (Lime by default - Theme.accent;
       a cursor is a file and cannot follow a custom accent) and the
       bracket, twice the triangle's height yet finer than it - 22 tall
       against 10, with 2-wide arms - so it stands clear as a tall slim
       bracket rather than a chunky one. The dropped copy beneath is the
       only edge there is, so the white still reads over a bright
       filmstrip or a light theme. -->
  <g transform="translate(0, 1)" opacity="0.42" fill="#05070a">
    <path d="M6 12 L15 7 L15 17 Z"/>
    <path d="M18 1 H23.5 V23 H18 V21 H21.5 V3 H18 Z"/>
  </g>
  <path d="M6 12 L15 7 L15 17 Z" fill="#cbf53f"/>
  <path d="M18 1 H23.5 V23 H18 V21 H21.5 V3 H18 Z" fill="#ffffff"/>
</svg>
